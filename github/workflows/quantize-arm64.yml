name: Quantize on Arm64
 
on:
  workflow_dispatch:
 
jobs:
  quantize-arm64:
    runs-on: ubuntu-24.04-arm
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Install dependencies
        run: pip install transformers torch
 
      - name: Download original model
        run: python models/download_model.py
 
      - name: Run quantization + speed measurement
        run: python optimize/quantize.py
 
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: quantized-arm64-results
          path: results/raw/quantized_int8_*.json